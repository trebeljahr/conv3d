<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Docs temporarily unavailable - conv3d</title>
    <style type="text/css">
      :root {
        color-scheme: dark;
        --bg: #081014;
        --panel: #101a20;
        --text: #eef8f7;
        --muted: #a6b8ba;
        --accent: #2dd4bf;
        --border: #24343a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          linear-gradient(135deg, rgba(45, 212, 191, 0.14), transparent 34rem),
          var(--bg);
        color: var(--text);
      }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .notice {
        width: min(100%, 42rem);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        padding: clamp(2rem, 7vw, 4rem);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0 0 3rem;
        color: var(--accent);
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .mark {
        display: inline-grid;
        width: 2rem;
        height: 2rem;
        place-items: center;
        border-radius: 7px;
        background: var(--accent);
        color: #071013;
        font-size: 0.86rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        max-width: 12ch;
        font-size: clamp(2.4rem, 8vw, 4.8rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        margin: 1.3rem 0 0;
        max-width: 35rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 2rem;
      }

      a {
        color: var(--text);
        text-decoration-color: color-mix(in srgb, var(--accent) 65%, transparent);
        text-underline-offset: 0.22em;
      }

      .links a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.03);
        font-weight: 650;
        text-decoration: none;
      }

      .links a:first-child {
        border-color: var(--accent);
        background: rgba(45, 212, 191, 0.12);
      }

      @media (max-width: 34rem) {
        .page {
          align-items: stretch;
          padding: 1rem;
        }

        .notice {
          align-self: center;
          padding: 1.5rem;
        }

        .links {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="notice">
        <p class="wordmark">
          <span class="mark">3d</span>
          conv3d
        </p>

        <h1 id="page-title">Docs temporarily unavailable</h1>
        <p>
          The documentation site is offline for a moment. The project remains
          available on GitHub, and you can contact the maintainer by email if
          this outage blocks your work.
        </p>

        <div class="links">
          <a href="mailto:hello@trebeljahr.com">hello@trebeljahr.com</a>
          <a href="https://github.com/trebeljahr/conv3d">https://github.com/trebeljahr/conv3d</a>
        </div>
      </div>
    </div>
  </body>
</html>
