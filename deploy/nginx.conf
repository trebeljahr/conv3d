map $remote_addr $drain_marker {
    127.0.0.1 /tmp/conv3d-draining;
    ::1 /tmp/conv3d-draining;
    default /tmp/conv3d-not-a-probe;
}

# Next's exported RSC requests identify their build. Only a full SHA may select
# a retained directory; unknown/expired IDs get a real 404 and client navigation
# reloads the same URL. Never fall through to current RSC with old client code.
map $http_x_deployment_id $docs_release_root {
    default /usr/share/nginx/html;
    "~^[a-f0-9]{40}$" /var/lib/conv3d-docs-releases/releases/$http_x_deployment_id;
}
map $http_x_deployment_id $docs_response_deployment {
    default "";
    "~^[a-f0-9]{40}$" $http_x_deployment_id;
}
map $http_x_deployment_id $docs_invalid_release {
    default 1;
    "" 0;
    "~^[a-f0-9]{40}$" 0;
}

server {
    listen 80;
    server_name _;
    root $docs_release_root;
    if ($docs_invalid_release) { return 400; }
    add_header Cache-Control "no-store" always;
    add_header Vary "x-deployment-id" always;
    # Exported Flight data contains a build ID; Next navigation uses the
    # deployment ID instead when configured. Echo only the validated tree ID.
    add_header x-nextjs-deployment-id $docs_response_deployment always;
    absolute_redirect off;

    location ^~ /__releases/ { return 404; }
    location ^~ /__legacy-assets/ { return 404; }

    location ^~ /_next/static/ {
        root /var/lib/conv3d-docs-releases;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Runtime-fetched public files (scene models, the Draco decoder, demo
    # media and the static search index) are addressed by release SHA, so an
    # old tab keeps its exact bytes from either container. Expired SHAs 404.
    location ~ "^/_release/([a-f0-9]{40})/((?:models|draco|media)/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*|api/search)$" {
        alias /var/lib/conv3d-docs-releases/releases/$1/$2;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /_release/ { return 404; }

    location = /releases.json {
        root /var/lib/conv3d-docs-releases;
        add_header Cache-Control "no-store" always;
        try_files /releases.json =404;
    }

    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /version.json =404;
    }
    index index.html;

    # Coolify probes /. Stop passing this probe before nginx stops serving.
    location = / {
        if (-f $drain_marker) { return 503; }
        try_files /index.html =404;
    }

    # The export writes `<route>.html` beside a `<route>/` directory of RSC
    # segment files and no `<route>/index.html`. Prefer the page; a slash form
    # can only 403, so redirect it (relative Location, see absolute_redirect).
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
