name: CI

# Runs lint, typecheck, and tests for the CLI on every push and PR.
# Docs site has its own workflow (docs.yml); this one focuses on src/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint src scripts tests package.json README.md

      - name: Typecheck / build
        run: pnpm run build

      - name: Test
        run: node --test "tests/**/*.test.mjs"

      - name: Audit JSON schema
        run: pnpm run audit:schema
