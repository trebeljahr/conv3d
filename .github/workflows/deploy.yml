# Candidate builds never move a live tag. Deployment requires explicit activation.
# CONV3D_ROLLOUT_MODE: unset/off, manual, or automatic.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, deploy a reviewed image, or verify a release
        type: choice
        options: [build, deploy, verify]
        default: build
      target_sha:
        description: Full commit SHA required for deploy or verify
        type: string
        required: false
      image_digest:
        description: Exact sha256 image digest from the build artifact (deploy only)
        type: string
        required: false
      expected_current_digest:
        description: Reviewed current latest digest (deploy only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: image-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    if: github.repository == 'trebeljahr/conv3d' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/release.test.mjs scripts/rolling-release.test.mjs scripts/retained-docs.test.mjs scripts/shared-docs-releases.test.mjs
      - name: Test shared release routing with nginx
        run: RUN_DOCKER_TESTS=1 node --test --test-concurrency=1 scripts/shared-docs-http.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: baseline
        name: Pin the verified serving image and reject SHA rebuilds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-docs-build.mjs
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trebeljahr/conv3d
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site-release
          cache-to: type=gha,mode=max,scope=site-release
          platforms: linux/amd64
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            PREVIOUS_IMAGE=${{ steps.baseline.outputs.previous_image }}
            PREVIOUS_SHA=${{ steps.baseline.outputs.previous_sha }}
            PREVIOUS_DIGEST=${{ steps.baseline.outputs.previous_digest }}

      - name: Record immutable release identity
        env:
          IMAGE: ghcr.io/trebeljahr/conv3d
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { GITHUB_SHA: commit, IMAGE: image, IMAGE_DIGEST: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error('Missing full release identity.');
          const ancestry = JSON.parse(readFileSync('build-inputs.json', 'utf8'));
          if (ancestry.commit !== commit) throw new Error('Build ancestry does not match source.');
          writeFileSync('release.json', JSON.stringify({ ...ancestry, commit, image, digest, reference: `${image}@${digest}` }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release.json
            build-inputs.json
          if-no-files-found: error

  verify:
    if: github.repository == 'trebeljahr/conv3d' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit without deploying
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/conv3d' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.CONV3D_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Promote, queue this app, and verify the release
        env:
          ROLLOUT_MODE: ${{ vars.CONV3D_ROLLOUT_MODE }}
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          TARGET_DIGEST: ${{ github.event_name == 'push' && needs.build.outputs.digest || inputs.image_digest }}
          EXPECTED_CURRENT_DIGEST: ${{ inputs.expected_current_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
        run: node scripts/rolling-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollout.json
          if-no-files-found: warn
