# Builds the docs site, uploads it as a new version of the conv3d-docs
# Cloudflare Worker and, when allowed, activates it. Uploading never changes
# what visitors get; only the deploy job does. See scripts/WORKER-RELEASES.md.
# CONV3D_ROLLOUT_MODE: unset/off or manual (build only), or automatic.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, deploy an uploaded version, or verify a release
        type: choice
        options: [build, deploy, verify]
        default: build
      target_sha:
        description: Full commit SHA required for deploy or verify
        type: string
        required: false
      version_id:
        description: Worker version ID from the build job's release.json (deploy only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: site-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ORIGIN: https://conv3d.trebeljahr.com
  WRANGLER: wrangler@4.145.0

jobs:
  build:
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      releases: ${{ steps.finish.outputs.releases }}
    if: github.repository == 'trebeljahr/conv3d' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/worker-release.test.mjs docs/lib/error-reporting/scrub.test.mjs
      - name: Build the static export
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          # A repository variable, not a secret: the DSN is in the shipped
          # bundle either way. Empty builds a site that loads no SDK and
          # reports nothing. See docs/lib/error-reporting/reporter.ts.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          [ -n "$NEXT_PUBLIC_SENTRY_DSN" ] || echo "::notice::NEXT_PUBLIC_SENTRY_DSN is empty; this build reports no errors."
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs build
          node scripts/write-version.mjs docs/out "$GITHUB_SHA"
          node scripts/worker-release.mjs stage docs/out "$GITHUB_SHA"
      # Old tabs keep loading their own chunks and /_release/<sha>/ files: the
      # live Worker lists them in /release-assets.json and this build carries
      # them into the new version. No live manifest fails the build.
      - name: Carry the live releases' files
        run: node scripts/carry-static.mjs --site "$ORIGIN" --out docs/out --release "$GITHUB_SHA" --dir _next/static --dir _release --require-previous
      - id: finish
        name: Write the release list and headers, check the Workers limits
        run: |
          node scripts/worker-release.mjs finish docs/out "$GITHUB_SHA" | tee finish.json
          echo "releases=$(node -p 'require("./finish.json").releases.join(",")')" >> "$GITHUB_OUTPUT"
      - id: upload
        name: Upload a Worker version without activating it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx --yes "$WRANGLER" versions upload --tag "$GITHUB_SHA" --message "Build ${GITHUB_SHA::12} run $GITHUB_RUN_ID"
          version_id=$(node -e '
            const rows = require("fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").trim().split("\n").map(JSON.parse);
            const row = rows.find((entry) => entry.type === "version-upload");
            if (!/^[0-9a-f-]{36}$/.test(row?.version_id ?? "")) throw new Error("Wrangler reported no version ID.");
            console.log(row.version_id);')
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          node -e 'require("fs").writeFileSync("release.json", JSON.stringify({ commit: process.env.GITHUB_SHA, versionId: process.argv[1], ...require("./finish.json") }, null, 2) + "\n")' "$version_id"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error

  verify:
    if: github.repository == 'trebeljahr/conv3d' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit without deploying
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/conv3d' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.CONV3D_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Activate the uploaded version and verify it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSH: ${{ github.event_name == 'push' }}
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          VERSION_ID: ${{ github.event_name == 'push' && needs.build.outputs.version_id || inputs.version_id }}
          CARRIED: ${{ needs.build.outputs.releases }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ && "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "A full SHA and a version ID are required."; exit 1; }
          # wrangler reads wrangler.jsonc, which names an assets directory.
          mkdir -p docs/out
          tag=$(npx --yes "$WRANGLER" versions view "$VERSION_ID" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).annotations?.["workers/tag"] ?? ""')
          [ "$tag" = "$TARGET_SHA" ] || { echo "Version $VERSION_ID was built from '$tag', not $TARGET_SHA."; exit 1; }
          if [ "$PUSH" = "true" ]; then
            # A push deploy must keep the chunks of the release visitors have open.
            live=$(curl -fsS --max-time 15 "$ORIGIN/releases.json?at=$(date +%s)" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).head')
            [[ ",$CARRIED," == *",$live,"* ]] || { echo "Live release $live is not carried by $TARGET_SHA; rebuild."; exit 1; }
          fi
          npx --yes "$WRANGLER" versions deploy "$VERSION_ID@100%" --yes --message "Deploy ${TARGET_SHA::12} run $GITHUB_RUN_ID"
          node scripts/verify-release.mjs "$TARGET_SHA"
